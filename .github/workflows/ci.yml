name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.15
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install -r requirements-dev.txt

    - name: Run Ruff (Lint)
      run: ruff check .

    - name: Run Ruff (Format Check)
      run: ruff format --check .

    - name: Run Pytest
      run: pytest

  terraform:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.17.0

    - name: Check Terraform formatting
      working-directory: infra/terraform
      run: terraform fmt -check -recursive

    - name: Validate bootstrap configuration
      run: |
        terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
        terraform -chdir=infra/terraform/bootstrap validate -no-color

    - name: Validate application configuration
      run: |
        terraform -chdir=infra/terraform/app init -backend=false -input=false
        terraform -chdir=infra/terraform/app validate -no-color
